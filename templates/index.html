<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Cart POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>

<div class="app">
    <div class="left-side">
        <div class="scanner-header">
            <input type="text" id="barcode" placeholder="Scan barcode..." autocomplete="off">
        </div>

        <div class="main-display">
            <div class="image-wrapper">
                <img id="productImage" src="https://via.placeholder.com/150?text=Ready+to+Scan">
            </div>
            <div class="info-wrapper">
                <h2 id="productName">Ready to Scan</h2>
                <h3 id="productPrice">Rs 0</h3>
            </div>
        </div>

        <div class="ai-footer">
            <span class="section-label">AI Recommendations</span>
            <div class="ai-list">
                <div class="ai-card" onclick="addRecommended('111111','Bread',180,'bread.png')">
                    <img src="/static/images/bread.png">
                    <div class="ai-card-text">
                        <span>Bread</span>
                        <small>Rs 180</small>
                    </div>
                </div>
                <div class="ai-card" onclick="addRecommended('222222','Butter',220,'butter.png')">
                    <img src="/static/images/butter.png">
                    <div class="ai-card-text">
                        <span>Butter</span>
                        <small>Rs 220</small>
                    </div>
                </div>
                <div class="ai-card" onclick="addRecommended('333333','Eggs',320,'eggs.png')">
                    <img src="/static/images/eggs.png">
                    <div class="ai-card-text">
                        <span>Eggs</span>
                        <small>Rs 320</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="vertical-divider"></div>

    <div class="right-side">
        <h2 class="cart-title">Your Cart</h2>
        <div id="cartItems" class="cart-items"></div>

        <div class="bill">
            <div class="row"><span>Subtotal</span><strong id="subtotal">Rs 0</strong></div>
            <div class="row"><span>Tax</span><strong id="tax">Rs 0</strong></div>
            <div class="row total"><span>Total</span><strong id="grandTotal">Rs 0</strong></div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>
</div>

<script>
    // --- Logic is exactly the same as requested ---
    let currentProduct = null;
    const taxRate = 0.05;

    function formatCurrency(value) {
        return "Rs " + Number(value).toFixed(1).replace(".0", "");
    }

    function setProductView(product) {
        currentProduct = product;
        document.getElementById("productName").innerText = product.name || "Ready to Scan";
        document.getElementById("productPrice").innerText = formatCurrency(product.price || 0);
        const imageEl = document.getElementById("productImage");
        imageEl.src = product.image ? ("/static/images/" + product.image) : "https://via.placeholder.com/150?text=No+Image";
    }

    function updateCartUI(cartData) {
        const container = document.getElementById("cartItems");
        container.innerHTML = "";
        (cartData.items || []).forEach(item => {
            container.innerHTML += `
                <div class="cart-item">
                    <div class="cart-item-left">
                        <h4>${item.name}</h4>
                        <p>${formatCurrency(item.price)}</p>
                    </div>
                    <div class="qty-controls">
                        <button onclick="removeItem('${item.barcode}')">−</button>
                        <span>${item.qty}</span>
                        <button onclick="addItem('${item.barcode}')">+</button>
                    </div>
                </div>`;
        });
    }

    function updateBill(cartData) {
        const subtotal = Number(cartData.total || 0);
        const tax = subtotal * taxRate;
        const total = subtotal + tax;
        document.getElementById("subtotal").innerText = formatCurrency(subtotal);
        document.getElementById("tax").innerText = formatCurrency(tax);
        document.getElementById("grandTotal").innerText = formatCurrency(total);
        updateCartUI(cartData);
    }

    function loadCart() {
        fetch("/cart").then(res => res.json()).then(data => updateBill(data));
    }

    function searchProduct() {
        const barcode = document.getElementById("barcode").value.trim();
        if (!barcode) return;
        fetch("/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ barcode })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "found") {
                setProductView(data);
                addItem(data.barcode);
            } else {
                alert("Product not found");
            }
            document.getElementById("barcode").value = "";
        });
    }

    function addItem(barcode) {
        fetch("/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ barcode })
        }).then(res => res.json()).then(data => updateBill(data));
    }

    function removeItem(barcode) {
        fetch("/remove", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ barcode })
        }).then(res => res.json()).then(data => updateBill(data));
    }

    function addRecommended(barcode, name, price, image) {
        setProductView({ barcode, name, price, image });
        addItem(barcode);
    }

    function checkout() { window.location.href = "/checkout"; }

    let scanTimer;
    document.getElementById("barcode").addEventListener("input", function () {
        clearTimeout(scanTimer);
        scanTimer = setTimeout(searchProduct, 300);
    });

    window.onload = function () {
        loadCart();
        document.getElementById("barcode").focus();
    };
</script>
</body>
</html>
