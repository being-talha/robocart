<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart AI Cart POS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
<style>
    /* Inlined styling to position the back button beside the scanner smoothly */
    .scanner-header {
        display: flex;
        align-items: center;
        gap: 15px;
        width: 100%;
    }
    .btn-back-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #ffffff;
        color: #2d917e;
        border: 1px solid rgba(45, 145, 126, 0.2);
        padding: 12px 20px;
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        transition: all 0.2s ease-in-out;
        white-space: nowrap;
    }
    .btn-back-home:hover {
        background: #f0f7f9;
        transform: translateX(-2px);
        border-color: #2d917e;
    }
</style>
</head>

<body>
<div class="app">

    <div class="left-side">

        <div class="scanner-header">
            <a href="{{ url_for('home') }}" class="btn-back-home">
                <i class="fas fa-arrow-left"></i> Exit Cart
            </a>
            <input type="text" id="barcode" placeholder="Scan barcode..." autocomplete="off">
        </div>

        <div class="main-display">
            <div class="image-wrapper">
                <img id="productImage" src="https://via.placeholder.com/150?text=Ready+to+Scan">
            </div>
            <div class="info-wrapper">
                <h2 id="productName">Ready to Scan</h2>
                <h3 id="productPrice" style="display:none;">0</h3>
            </div>
        </div>

        <div class="ai-footer">
            <span class="section-label">Recommendations</span>

            <div class="ai-list">
                <div class="ai-card" style="cursor: default;">
                    <img src="/static/images/bread.png">
                    <div class="ai-card-text">
                        <span>Bread</span>
                        <small>Rs 180</small>
                    </div>
                </div>

                <div class="ai-card" style="cursor: default;">
                    <img src="/static/images/butter.png">
                    <div class="ai-card-text">
                        <span>Butter</span>
                        <small>Rs 220</small>
                    </div>
                </div>

                <div class="ai-card" style="cursor: default;">
                    <img src="/static/images/eggs.png">
                    <div class="ai-card-text">
                        <span>Eggs</span>
                        <small>Rs 320</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="vertical-divider"></div>

    <div class="right-side">
        <h2 class="cart-title" id="cartIcon">Your Cart</h2>
        <div id="cartItems" class="cart-items"></div>

        <div class="bill">
            <button type="button" class="clear-cart-btn" onclick="clearCart()">
                Clear Cart
            </button>

            <div class="row"><span>Subtotal</span><strong id="subtotal">Rs 0</strong></div>
            <div class="row"><span>Tax(5%)</span><strong id="tax">Rs 0</strong></div>
            <div class="row total"><span>Total</span><strong id="grandTotal">Rs 0</strong></div>

            <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">
                Proceed to Checkout
            </button>
        </div>
    </div>
</div>

<script>
let currentProduct = null;
const taxRate = 0.05;

function formatCurrency(value) {
    return "Rs " + Number(value).toFixed(1).replace(".0", "");
}

function setProductView(product) {
    currentProduct = product;

    document.getElementById("productName").innerText =
        product.name || "Ready to Scan";

    document.getElementById("productPrice").innerText =
        formatCurrency(product.price || 0);

    const imageEl = document.getElementById("productImage");

    if (product.image) {
        imageEl.src = "/static/images/" + product.image;
    } else {
        imageEl.src = "https://via.placeholder.com/260x220?text=No+Image";
    }
}

function resetProductView() {
    currentProduct = null;
    document.getElementById("productName").innerText = "Ready to Scan";
    document.getElementById("productPrice").innerText = "Rs 0";
    document.getElementById("productImage").src = "https://via.placeholder.com/260x220?text=Scan+Item";
}

function updateBill(cartData) {
    const subtotal = Number(cartData.total || 0);
    const tax = subtotal * taxRate;
    const total = subtotal + tax;

    document.getElementById("subtotal").innerText = formatCurrency(subtotal);
    document.getElementById("tax").innerText = formatCurrency(tax);
    document.getElementById("grandTotal").innerText = formatCurrency(total);

    const cartContainer = document.getElementById("cartItems");
    cartContainer.innerHTML = "";

    (cartData.items || []).forEach(item => {
        cartContainer.innerHTML += `
            <div class="cart-item">
                <img src="/static/images/${item.image}" width="50">
                <div class="cart-info">
                    <strong>${item.name}</strong>
                    <small>${formatCurrency(item.price)} x ${item.qty}</small>
                </div>
                <div class="cart-total">
                    ${formatCurrency(item.price * item.qty)}
                </div>
            </div>
        `;
    });
}

function clearCart() {
    return fetch("/clear-cart", {
        method: "POST"
    })
    .then(res => res.json())
    .then(data => {
        updateBill(data);
        resetProductView();

        const barcodeInput = document.getElementById("barcode");
        barcodeInput.value = "";
        barcodeInput.focus();
    })
    .catch(err => console.error("Clear cart error:", err));
}
function loadCart() {
    fetch("/cart")
        .then(res => res.json())
        .then(data => updateBill(data))
        .catch(err => console.error("Cart load error:", err));
}

function searchProduct() {
    const barcodeInput = document.getElementById("barcode");
    const barcode = barcodeInput.value.trim();
    if (!barcode) return;

    fetch("/search", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({barcode: barcode})
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "found") {
            setProductView(data);
            addCurrentProduct();
        } else {
            alert("Product not found");
            resetProductView();
        }

        barcodeInput.value = "";
        barcodeInput.focus();
    })
    .catch(err => alert("Search failed"));
}

function addCurrentProduct() {
    if (!currentProduct) return;

    fetch("/add", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({barcode: currentProduct.barcode})
    })
    .then(res => res.json())
    .then(data => updateBill(data))
    .catch(err => alert("Failed to add item"));
}

// Fixed missing dynamic recommendation assignment logic inside your helper
function addRecommended(barcode, name, price, image) {
    currentProduct = {barcode, name, price, image};
    setProductView(currentProduct);
    addCurrentProduct();
}

function checkout() {
    window.location.href = "/checkout";
}

document.getElementById("barcode").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        searchProduct();
    }
});

window.addEventListener("pageshow", function(event) {
    const fromCheckout = sessionStorage.getItem("fromCheckout");

    if (fromCheckout === "true") {
        sessionStorage.removeItem("fromCheckout");
        loadCart();
    } else {
        clearCart();
    }

    document.getElementById("barcode").focus();
});
</script>

<script src="{{ url_for('static', filename='coach.js') }}"></script>
</body>
</html>
